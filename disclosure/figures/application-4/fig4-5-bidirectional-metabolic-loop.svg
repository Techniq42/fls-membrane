<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 910" width="1100" height="910">
<style>
.l{stroke:#000;fill:none;stroke-width:2}
.thin{stroke:#000;fill:none;stroke-width:1.2}
.f{stroke:#000;fill:#fff;stroke-width:2}
.d{stroke:#000;fill:none;stroke-width:1.6;stroke-dasharray:3 4}
.s{font:11px Arial,Helvetica,sans-serif;fill:#000}
.b{font:bold 12px Arial,Helvetica,sans-serif;fill:#000}
.n{font:bold 13px Arial,Helvetica,sans-serif;fill:#000}
.h{font:bold 20px Arial,Helvetica,sans-serif;fill:#000}
</style>
<defs>
<marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#000"/></marker>
<pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="8" stroke="#000" stroke-width="1"/></pattern>
</defs>
<rect width="1100" height="910" fill="#fff"/>
<text x="550" y="40" text-anchor="middle" class="h">FIG. 5 — Bi-Directional Logistics inside the Bioregional Metabolic Loop</text>

<!-- stations on a circuit -->
<rect class="f" x="440" y="80" width="200" height="70"/><text x="540" y="110" text-anchor="middle" class="b">URBAN METABOLIC HUB</text><text x="540" y="128" text-anchor="middle" class="s">(FIG. 2)</text>
<rect class="f" x="820" y="270" width="200" height="70"/><text x="920" y="300" text-anchor="middle" class="b">NEIGHBORHOOD NODES</text><text x="920" y="318" text-anchor="middle" class="s">+ surplus generators</text>
<path class="f" d="M760,560 l80,0 l40,40 l-40,40 l-80,0 l-40,-40 z"/><text x="800" y="596" text-anchor="middle" class="b">RURAL</text><text x="800" y="612" text-anchor="middle" class="b">CENTER</text>
<rect class="l" x="240" y="560" width="200" height="80" style="fill:url(#hatch)"/><rect class="f" x="290" y="585" width="100" height="30"/><text x="340" y="605" text-anchor="middle" class="b">FARMS</text>
<rect class="f" x="60" y="270" width="200" height="70"/><text x="160" y="300" text-anchor="middle" class="b">FABRICATION</text><text x="160" y="318" text-anchor="middle" class="s">+ repair (FIG. 3)</text>

<!-- legs: each with out (solid) and back (solid) -->
<!-- L1 hub -> nodes / back -->
<path class="l" marker-end="url(#a)" d="M640,105 C760,110 860,170 900,266"/>
<path class="l" marker-end="url(#a)" d="M880,270 C840,200 760,150 642,135"/>
<!-- L2 nodes -> rural / back -->
<path class="l" marker-end="url(#a)" d="M960,342 C960,450 900,530 852,560"/>
<path class="l" marker-end="url(#a)" d="M830,560 C870,500 910,420 925,344"/>
<!-- L3 rural -> farms / back -->
<path class="l" marker-end="url(#a)" d="M720,590 L442,590"/>
<path class="l" marker-end="url(#a)" d="M442,620 L720,620"/>
<!-- L4 farms -> fabrication / back -->
<path class="l" marker-end="url(#a)" d="M260,560 C200,480 170,420 165,344"/>
<path class="l" marker-end="url(#a)" d="M190,344 C200,420 230,490 280,558"/>
<!-- L5 fabrication -> hub / back -->
<path class="l" marker-end="url(#a)" d="M200,268 C260,180 350,130 438,115"/>
<path class="l" marker-end="url(#a)" d="M438,140 C350,160 270,210 230,268"/>

<!-- payload labels -->
<g class="s">
<text x="770" y="160">out: finished goods, bulk</text><text x="770" y="174">back: organics, returnables,</text><text x="770" y="188">packaging scrap</text>
<text x="975" y="430">out: sorted organics</text><text x="975" y="444">back: soil amendment,</text><text x="975" y="458">BSF larvae (feed)</text>
<text x="500" y="575">out: soil amendment, inoculant, larvae feed</text>
<text x="500" y="645">back: surplus harvest, crop residue</text>
<text x="40" y="440">out: broken parts,</text><text x="40" y="454">residue fiber</text><text x="210" y="510">back: printed</text><text x="210" y="524">repair parts</text>
<text x="230" y="180">out: packaging, parts</text><text x="300" y="232">back: cellulose feedstock,</text><text x="300" y="246">part orders</text>
</g>

<!-- inner biological loop: soil, water, crop, people -->
<circle class="d" cx="560" cy="380" r="120"/>
<g class="s">
<text x="560" y="275" text-anchor="middle">people eat</text>
<text x="680" y="384">organics</text>
<text x="560" y="500" text-anchor="middle">soil holds water</text>
<text x="400" y="384" text-anchor="end">crops grow</text>
</g>
<g class="thin">
<path marker-end="url(#a)" d="M620,276 C650,290 670,320 676,350"/>
<path marker-end="url(#a)" d="M676,410 C670,440 650,470 615,488"/>
<path marker-end="url(#a)" d="M505,488 C470,470 450,440 444,410"/>
<path marker-end="url(#a)" d="M444,350 C450,320 470,290 505,276"/>
</g>
<text x="560" y="372" text-anchor="middle" class="b">WATERSHED</text>
<text x="560" y="390" text-anchor="middle" class="s">retention, recharge,</text>
<text x="560" y="404" text-anchor="middle" class="s">less runoff, less methane</text>

<!-- vehicle inset -->
<rect class="thin" x="40" y="680" width="420" height="160"/>
<text x="290" y="697" text-anchor="middle" class="b">vehicle section: one run, both directions</text>
<!-- cab (front) -->
<path class="f" d="M60,790 L60,745 L78,722 L118,722 L118,790 z"/>
<path class="thin" d="M66,748 L80,730 L110,730 L110,748 z"/>
<!-- truck body: clean bay right behind the cab -->
<rect class="f" x="122" y="712" width="150" height="78"/>
<text x="197" y="745" text-anchor="middle" class="s">sealed clean bay</text><text x="197" y="759" text-anchor="middle" class="s">(food, goods)</text>
<!-- hitch -->
<path class="l" d="M272,782 L298,782" stroke-width="3"/><circle class="thin" cx="298" cy="782" r="4"/>
<!-- trailer: waste -->
<rect class="f" x="300" y="712" width="145" height="78"/>
<text x="372" y="745" text-anchor="middle" class="s">waste trailer</text><text x="372" y="759" text-anchor="middle" class="s">(organics, scrap)</text>
<g class="thin"><circle cx="88" cy="802" r="12"/><circle cx="160" cy="802" r="12"/><circle cx="240" cy="802" r="12"/><circle cx="350" cy="802" r="12"/><circle cx="410" cy="802" r="12"/></g>
<text x="62" y="708" class="s">front</text>
<text x="250" y="832" text-anchor="middle" class="s">clean load by the cab; waste in a towed trailer, washed between legs</text>

<!-- numerals -->
<g class="thin">
<path d="M640,90 L680,70"/><path d="M1020,300 L1050,280"/><path d="M880,600 L920,620"/><path d="M240,600 L210,620"/>
<path d="M60,300 L40,250"/><path d="M905,250 L1000,215"/><path d="M640,470 L700,520"/><path d="M286,782 L286,860"/>
</g>
<g class="n">
<text x="684" y="68">502</text><text x="1050" y="276">504</text><text x="922" y="636">506</text><text x="182" y="636">508</text>
<text x="28" y="244">510</text><text x="1004" y="213">512</text><text x="702" y="536">514</text><text x="273" y="876">516</text>
</g>
<rect class="thin" x="520" y="690" width="540" height="160"/>
<g class="s">
<text x="532" y="710">502 Urban Metabolic Hub · 504 Neighborhood Nodes and surplus generators</text>
<text x="532" y="728">506 Rural Strategic Processing Center (EM fermentation, black soldier fly,</text>
<text x="532" y="744">biochar) · 508 farms · 510 fabrication and repair node</text>
<text x="532" y="762">512 circuit routing: every leg is loaded both ways, and legs chain into a</text>
<text x="532" y="778">loop so no vehicle returns empty</text>
<text x="532" y="796">514 the biological loop the trucks serve: food to people, organics to soil,</text>
<text x="532" y="812">soil to water retention, water to crops, crops back to the hub</text>
<text x="532" y="830">516 truck and trailer: clean bay at the cab, waste in the towed trailer</text>

</g>
</svg>
