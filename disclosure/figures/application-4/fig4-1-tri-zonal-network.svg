<!-- legend -->
<rect class="thin" x="40" y="760" width="1020" height="118"/>
<g class="s">
<path class="l" marker-end="url(#a)" d="M55,780 L95,780"/><text x="102" y="784">material flow</text>
<path class="d" marker-end="url(#a)" d="M55,802 L95,802"/><text x="102" y="806">data only (recipes, G-code, licenses)</text>
<path class="dd" d="M55,822 L95,822"/><text x="102" y="826">watershed boundary</text>
<text x="320" y="782">102 watershed / bioregion · 104 geographic barrier (ridge, pass, ocean) · 106 river system · 110 urban area</text>
<text x="320" y="800">112 Urban Metabolic Hub (Tier 2) · 114 Neighborhood Distribution Nodes (Tier 1) · 116 surplus generators (venues, hotels, hospitals, grocers)</text>
<text x="320" y="818">120 Rural Strategic Processing Center (Tier 3) · 122 farms · 132 organics and packaging feedstock to Tier 3 · 138 soil amendment to farms</text>
<text x="320" y="836">140 surplus harvest to hub · 142 soil water retention and aquifer recharge · 144 Pass Protocol: recipes cross the barrier as data only</text>
<text x="320" y="854">146 no finished goods or empty packaging cross the barrier · 150 hub beyond the barrier, manufacturing locally · 152 its local inputs</text>
