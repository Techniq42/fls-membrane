<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 760" font-family="Arial, Helvetica, sans-serif">
  <rect x="0" y="0" width="1000" height="760" fill="#ffffff"/>
  <style>
    .box  { fill:#ffffff; stroke:#000000; stroke-width:2; }
    .dash { fill:#ffffff; stroke:#000000; stroke-width:2; stroke-dasharray:7 5; }
    .rule { fill:#ffffff; stroke:#000000; stroke-width:4; }
    .t    { font-size:14px; fill:#000; text-anchor:middle; }
    .tb   { font-size:14px; fill:#000; text-anchor:middle; font-weight:bold; }
    .ts   { font-size:11px; fill:#000; text-anchor:middle; }
    .td   { font-size:12px; fill:#000; text-anchor:middle; }
    .n    { font-size:13px; fill:#000; font-style:italic; text-anchor:middle; }
    .ln   { stroke:#000; stroke-width:2; fill:none; }
  </style>
  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="7.5" refY="3.5" orient="auto">
      <path d="M0,0 L8,3.5 L0,7 z" fill="#000"/>
    </marker>
  </defs>

  <!-- 100 system boundary -->
  <rect x="30" y="42" width="940" height="672" rx="12" fill="none" stroke="#000" stroke-width="1.5" stroke-dasharray="3 6"/>
  <text x="48" y="66" font-size="13" font-style="italic">100  coordination system</text>

  <!-- instruction channel hint -->
  <text class="ts" x="92" y="96">INSTRUCTION</text>
  <text class="ts" x="92" y="110">INPUTS</text>
  <line class="ln" x1="92" y1="118" x2="150" y2="118" marker-end="url(#a)"/>

  <!-- 120 machine agent -->
  <rect class="box" x="150" y="90" width="210" height="58" rx="6"/>
  <text class="tb" x="255" y="115">MACHINE LANGUAGE-</text>
  <text class="tb" x="255" y="133">MODEL AGENT</text>
  <text class="n" x="345" y="84">120</text>

  <!-- 122 human agent -->
  <rect class="box" x="640" y="90" width="210" height="58" rx="6"/>
  <text class="tb" x="745" y="124">HUMAN AGENT</text>
  <text class="n" x="835" y="84">122</text>

  <!-- 170 capability-scoped connections -->
  <rect class="box" x="200" y="188" width="110" height="42" rx="6"/>
  <text class="ts" x="255" y="205">CAP-SCOPED</text>
  <text class="ts" x="255" y="219">CONNECTION</text>
  <text class="n" x="330" y="184">170</text>
  <rect class="box" x="690" y="188" width="110" height="42" rx="6"/>
  <text class="ts" x="745" y="205">CAP-SCOPED</text>
  <text class="ts" x="745" y="219">CONNECTION</text>
  <text class="n" x="820" y="184">170</text>

  <line class="ln" x1="255" y1="148" x2="255" y2="188" marker-end="url(#a)"/>
  <line class="ln" x1="745" y1="148" x2="745" y2="188" marker-end="url(#a)"/>

  <!-- converging into the rule -->
  <line class="ln" x1="255" y1="230" x2="430" y2="292" marker-end="url(#a)"/>
  <line class="ln" x1="745" y1="230" x2="570" y2="292" marker-end="url(#a)"/>

  <!-- 114 the per-record access rule (the interlock) -->
  <rect class="rule" x="350" y="294" width="300" height="100" rx="4"/>
  <text class="tb" x="500" y="320" font-size="15">PER-RECORD ACCESS RULE</text>
  <text class="ts" x="500" y="338" font-style="italic">evaluated at the datastore</text>
  <line x1="372" y1="348" x2="628" y2="348" stroke="#000" stroke-width="1"/>
  <text class="td" x="500" y="366">(i) sovereignty   (ii) governance</text>
  <text class="td" x="500" y="384">(iii) immune to instruction</text>
  <text class="n" x="628" y="312">114</text>

  <!-- rule to datastore -->
  <line class="ln" x1="500" y1="394" x2="500" y2="452" marker-end="url(#a)"/>

  <!-- 110 datastore with 112 records -->
  <rect class="box" x="390" y="452" width="220" height="148" rx="6"/>
  <text class="tb" x="500" y="476">SHARED COORDINATION</text>
  <text class="tb" x="500" y="493">STATE (DATASTORE)</text>
  <text class="n" x="634" y="466">110</text>
  <!-- 112 records, drawn as rows of the datastore -->
  <g stroke="#000" stroke-width="1.5" fill="#ffffff">
    <rect x="416" y="506" width="130" height="15"/>
    <rect x="416" y="525" width="130" height="15"/>
    <rect x="416" y="544" width="130" height="15"/>
    <line x1="454" y1="506" x2="454" y2="559"/>
    <line x1="504" y1="506" x2="504" y2="559"/>
  </g>
  <text x="481" y="578" font-size="11" font-style="italic" text-anchor="middle">records (rows)</text>
  <line x1="466" y1="622" x2="488" y2="560" stroke="#000" stroke-width="1"/>
  <text class="n" x="460" y="636">112</text>

  <!-- 140 recursive loop (right wing) -->
  <rect class="box" x="680" y="478" width="196" height="66" rx="6"/>
  <text class="td" x="778" y="505">RECURSIVE GOAL-</text>
  <text class="td" x="778" y="523">DIRECTED LOOP</text>
  <text class="n" x="866" y="472">140</text>
  <line class="ln" x1="610" y1="511" x2="680" y2="511" marker-start="url(#a)" marker-end="url(#a)"/>
  <text class="ts" x="645" y="502">reads /</text>
  <text class="ts" x="645" y="533">writes</text>

  <!-- 130 / 132 contexts -> 134 composition (left wing) -->
  <rect class="box" x="95" y="466" width="170" height="42" rx="6"/>
  <text class="td" x="180" y="492">AUTHORITY CONTEXT</text>
  <text class="n" x="252" y="462">130</text>
  <rect class="dash" x="95" y="540" width="170" height="46" rx="6"/>
  <text class="td" x="180" y="561">SOVEREIGN CONTEXT</text>
  <text class="ts" x="180" y="577">participant-held</text>
  <text class="n" x="252" y="536">132</text>

  <circle class="box" cx="335" cy="524" r="22"/>
  <text class="ts" x="335" y="521">com-</text>
  <text class="ts" x="335" y="533">pose</text>
  <text class="n" x="335" y="566">134</text>

  <line class="ln" x1="265" y1="490" x2="316" y2="514" marker-end="url(#a)"/>
  <line class="ln" x1="265" y1="560" x2="316" y2="534" marker-end="url(#a)"/>
  <line class="ln" x1="357" y1="524" x2="390" y2="524" marker-end="url(#a)"/>

  <text x="500" y="742" font-size="22" font-weight="bold" text-anchor="middle">FIG. 1</text>
</svg>
