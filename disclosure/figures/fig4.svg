<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" font-family="Arial, Helvetica, sans-serif">
  <rect x="0" y="0" width="1000" height="560" fill="#ffffff"/>
  <style>
    .box  { fill:#ffffff; stroke:#000; stroke-width:2; }
    .dash { fill:#ffffff; stroke:#000; stroke-width:2; stroke-dasharray:7 5; }
    .tb   { font-size:14px; fill:#000; text-anchor:middle; font-weight:bold; }
    .ts   { font-size:12px; fill:#000; text-anchor:middle; }
    .n    { font-size:13px; fill:#000; font-style:italic; text-anchor:middle; }
    .ln   { stroke:#000; stroke-width:2; fill:none; }
    .cn   { font-size:12px; fill:#000; font-weight:bold; text-anchor:middle; }
    .lg   { font-size:12.5px; fill:#000; }
  </style>
  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="7.5" refY="3.5" orient="auto">
      <path d="M0,0 L8,3.5 L0,7 z" fill="#000"/>
    </marker>
  </defs>

  <!-- 150 dispatcher -->
  <rect class="box" x="410" y="60" width="200" height="60" rx="6"/>
  <text class="tb" x="510" y="86">DISPATCHER</text>
  <text class="ts" x="510" y="104">routes, no reasoning</text>
  <text class="n" x="598" y="56">150</text>

  <!-- 190 help record (hero) -->
  <rect class="box" x="300" y="196" width="400" height="128" rx="8"/>
  <text class="tb" x="500" y="224" font-size="15">HELP RECORD</text>
  <text class="n" x="686" y="190">190</text>
  <!-- status timeline -->
  <rect class="box" x="326" y="250" width="118" height="34" rx="17"/>
  <text class="ts" x="385" y="272">needs_help</text>
  <rect class="box" x="456" y="250" width="90" height="34" rx="17"/>
  <text class="ts" x="501" y="272">claimed</text>
  <rect class="box" x="558" y="250" width="112" height="34" rx="17"/>
  <text class="ts" x="614" y="272">answered</text>
  <line class="ln" x1="444" y1="267" x2="456" y2="267" marker-end="url(#a)"/>
  <line class="ln" x1="546" y1="267" x2="558" y2="267" marker-end="url(#a)"/>
  <text class="ts" x="500" y="308" font-style="italic">one record in the shared coordination state (110)</text>

  <!-- 162 lower tier -->
  <rect class="box" x="60" y="226" width="190" height="72" rx="6"/>
  <text class="tb" x="155" y="256">SMALL LOCAL MODEL</text>
  <text class="ts" x="155" y="274">(lower tier)</text>
  <text class="n" x="256" y="220">162</text>

  <!-- 160 higher tier group -->
  <rect class="dash" x="770" y="196" width="200" height="150" rx="8"/>
  <text class="ts" x="870" y="216" font-weight="bold">HIGHER TIER</text>
  <text class="n" x="958" y="192">160</text>
  <rect class="box" x="788" y="228" width="164" height="44" rx="6"/>
  <text class="ts" x="870" y="255">FRONTIER MODEL</text>
  <text class="n" x="940" y="224">164</text>
  <rect class="box" x="788" y="286" width="164" height="44" rx="6"/>
  <text class="ts" x="870" y="313">HUMAN</text>
  <text class="n" x="940" y="282">166</text>

  <!-- flows -->
  <!-- (1) lower tier writes -->
  <line class="ln" x1="250" y1="248" x2="300" y2="248" marker-end="url(#a)"/>
  <circle cx="275" cy="230" r="10" fill="#fff" stroke="#000" stroke-width="1.5"/><text class="cn" x="275" y="234">1</text>
  <!-- (2) recognizes: record -> dispatcher -->
  <line class="ln" x1="500" y1="196" x2="500" y2="120" marker-end="url(#a)"/>
  <circle cx="522" cy="160" r="10" fill="#fff" stroke="#000" stroke-width="1.5"/><text class="cn" x="522" y="164">2</text>
  <!-- (3) routes: dispatcher -> higher tier -->
  <line class="ln" x1="610" y1="96" x2="786" y2="214" marker-end="url(#a)"/>
  <circle cx="690" cy="140" r="10" fill="#fff" stroke="#000" stroke-width="1.5"/><text class="cn" x="690" y="144">3</text>
  <!-- (4) higher tier claims + answers into same record -->
  <line class="ln" x1="770" y1="266" x2="700" y2="266" marker-end="url(#a)"/>
  <circle cx="735" cy="248" r="10" fill="#fff" stroke="#000" stroke-width="1.5"/><text class="cn" x="735" y="252">4</text>
  <!-- (5) asker reads answer -->
  <line class="ln" x1="300" y1="298" x2="250" y2="298" marker-end="url(#a)"/>
  <circle cx="275" cy="316" r="10" fill="#fff" stroke="#000" stroke-width="1.5"/><text class="cn" x="275" y="320">5</text>

  <!-- legend -->
  <rect class="box" x="60" y="392" width="880" height="112" rx="6"/>
  <text class="tb" x="500" y="416">ESCALATION — COORDINATION WITHOUT COUPLING</text>
  <text class="lg" x="80" y="440">1  the lower tier writes a help record (status: needs_help)</text>
  <text class="lg" x="80" y="460">2  the dispatcher recognizes the record</text>
  <text class="lg" x="80" y="480">3  the dispatcher routes it to a higher tier</text>
  <text class="lg" x="540" y="440">4  the higher tier claims and answers into the SAME record</text>
  <text class="lg" x="540" y="460">5  the asker reads the answer from the same record</text>
  <text class="lg" x="540" y="484" font-style="italic">asker and answerer are decoupled; neither holds the other's keys</text>

  <text x="500" y="540" font-size="22" font-weight="bold" text-anchor="middle">FIG. 4</text>
</svg>
