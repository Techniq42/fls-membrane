<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" font-family="Arial, Helvetica, sans-serif">
  <rect x="0" y="0" width="1000" height="520" fill="#ffffff"/>
  <style>
    .box  { fill:#ffffff; stroke:#000; stroke-width:2; }
    .srv  { fill:#ffffff; stroke:#000; stroke-width:2; stroke-dasharray:7 5; }
    .tb   { font-size:14px; fill:#000; text-anchor:middle; font-weight:bold; }
    .ts   { font-size:12px; fill:#000; text-anchor:middle; }
    .n    { font-size:13px; fill:#000; font-style:italic; text-anchor:middle; }
    .ln   { stroke:#000; stroke-width:2; fill:none; }
  </style>
  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="7.5" refY="3.5" orient="auto">
      <path d="M0,0 L8,3.5 L0,7 z" fill="#000"/>
    </marker>
  </defs>

  <!-- SERVER 1 -->
  <rect class="srv" x="50" y="80" width="360" height="330" rx="10"/>
  <text class="tb" x="230" y="108">SERVER 1 (sovereign)</text>
  <rect class="box" x="150" y="140" width="150" height="42" rx="6"/>
  <text class="ts" x="225" y="166">SEAT</text>
  <rect class="box" x="90" y="220" width="270" height="150" rx="6"/>
  <text class="tb" x="225" y="252">SHARED STATE</text>
  <text class="ts" x="225" y="271">(board A)</text>
  <text class="n" x="338" y="214">110</text>
  <rect class="box" x="120" y="292" width="210" height="14"/>
  <rect class="box" x="120" y="316" width="210" height="14"/>
  <line class="ln" x1="225" y1="182" x2="225" y2="220" marker-end="url(#a)"/>

  <!-- SERVER 2 -->
  <rect class="srv" x="590" y="80" width="360" height="330" rx="10"/>
  <text class="tb" x="770" y="108">SERVER 2 (sovereign)</text>
  <rect class="box" x="700" y="140" width="150" height="42" rx="6"/>
  <text class="ts" x="775" y="166">SEAT</text>
  <rect class="box" x="640" y="220" width="270" height="150" rx="6"/>
  <text class="tb" x="775" y="252">SHARED STATE</text>
  <text class="ts" x="775" y="271">(board B)</text>
  <text class="n" x="888" y="214">110</text>
  <rect class="box" x="670" y="292" width="210" height="14"/>
  <rect class="box" x="670" y="316" width="210" height="14"/>
  <line class="ln" x1="775" y1="182" x2="775" y2="220" marker-end="url(#a)"/>

  <!-- synapse 210 -->
  <rect class="box" x="440" y="250" width="120" height="66" rx="6"/>
  <text class="tb" x="500" y="280">SYNAPSE</text>
  <text class="ts" x="500" y="298">connector</text>
  <text class="n" x="500" y="238">210</text>

  <!-- capability-scoped connections between boards and synapse -->
  <line class="ln" x1="360" y1="283" x2="440" y2="283" marker-start="url(#a)" marker-end="url(#a)"/>
  <line class="ln" x1="560" y1="283" x2="640" y2="283" marker-start="url(#a)" marker-end="url(#a)"/>
  <text class="ts" x="400" y="272">170</text>
  <text class="ts" x="600" y="272">170</text>
  <text class="ts" x="400" y="304" font-style="italic">cap-scoped</text>
  <text class="ts" x="600" y="304" font-style="italic">cap-scoped</text>

  <!-- annotation -->
  <rect class="box" x="150" y="440" width="700" height="52" rx="6"/>
  <text class="ts" x="500" y="464">each server shares only the state it offers, through capability-scoped connections.</text>
  <text class="ts" x="500" y="482" font-weight="bold">Neither server holds host or datastore access to the other.</text>

  <text x="500" y="512" font-size="16" font-weight="bold" text-anchor="middle">FIG. 7</text>
</svg>
