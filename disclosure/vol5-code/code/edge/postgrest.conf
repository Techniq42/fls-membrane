# postgrest.conf - edge authorization example (Volume 5, Section F). Apache-2.0.
# UNTESTED as a running PostgREST process; the role pattern it relies on
# (log in once as authenticator, SET ROLE per verified request, current_holon()
# reads current_user) is tested in sql/20-interlock-tests.sql, T9a-T9d.
#
# authenticator  LOGIN NOINHERIT, member of web_anon and of each seat role
# web_anon       no holon mapping: the one rule returns commons rows only
# <seat role>    mapped in holon_roles; chosen by the "role" claim of a JWT
#                that PostgREST verifies with jwt-secret before any SQL runs
db-uri       = "postgres://authenticator@localhost:5432/membrane"   # password via PGPASSWORD or .pgpass, never here
db-schemas   = "public"
db-pre-request = "public.edge_pre_request"   # refuses seats on the revoked_seats deny list
db-anon-role = "web_anon"
jwt-secret   = "@/etc/postgrest/jwt.key"     # a file outside the web root
jwt-role-claim-key = ".role"
# tokens must carry "exp"; issue them with a short lifetime (15 minutes is a default to tune)
server-host  = "127.0.0.1"                    # only the edge proxy talks to PostgREST
server-port  = 3000
